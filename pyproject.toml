[project]
name = "wwna-variables-2024"
version = "0.1.0"
description = "Wastewater needs assessment variables analysis for California"
authors = [{name = "Daly Wettermark", email = "139182397+dalyw@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.8.20",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "numpy>=2.1.1",
    "geopandas>=0.14.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wwna_variables_2024"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
per-file-ignores = [
    "__init__.py:F401",
]
